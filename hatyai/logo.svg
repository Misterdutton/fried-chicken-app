<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <clipPath id="c"><circle cx="64" cy="64" r="59"/></clipPath>
  </defs>
  <style>
    .st{fill:none;stroke:#a08a74;stroke-width:3.8;stroke-linecap:round;opacity:.9}
    @keyframes rise{0%{transform:translateY(4px);opacity:0}30%{opacity:.9}100%{transform:translateY(-8px);opacity:0}}
    .s1,.s2,.s3{animation:rise 2.4s ease-in-out infinite}
    .s2{animation-delay:.8s}.s3{animation-delay:1.6s}
    @media (prefers-reduced-motion:reduce){.s1,.s2,.s3{animation:none}}
  </style>
  <circle cx="64" cy="64" r="62" fill="#fff4dc"/>
  <g clip-path="url(#c)">
    <!-- body: shirt + apron -->
    <path d="M14 128c0-20 12-30 36-32h4c24 2 36 12 36 32z" fill="#b91c1c" stroke="#7c2d12" stroke-width="2.4"/>
    <path d="M40 98h24l6 30H34z" fill="#fffaf0" stroke="#7c2d12" stroke-width="2"/>
    <path d="M44 98v-4M60 98v-4" stroke="#7c2d12" stroke-width="2"/>
    <!-- raised arm -->
    <path d="M80 104L94 72" stroke="#b91c1c" stroke-width="13" stroke-linecap="round"/>
    <path d="M80 104L94 72" stroke="#7c2d12" stroke-width="2" stroke-linecap="round" opacity="0"/>
  </g>
  <!-- neck + head -->
  <rect x="44" y="80" width="14" height="14" rx="4" fill="#eab587" stroke="#7c2d12" stroke-width="2"/>
  <circle cx="30" cy="62" r="5" fill="#eab587" stroke="#7c2d12" stroke-width="2"/>
  <circle cx="72" cy="62" r="5" fill="#eab587" stroke="#7c2d12" stroke-width="2"/>
  <circle cx="51" cy="60" r="21" fill="#f2c094" stroke="#7c2d12" stroke-width="2.4"/>
  <!-- grey side hair, bald top shine -->
  <path d="M31 58c0-8 3-13 7-16" fill="none" stroke="#cfcac3" stroke-width="6" stroke-linecap="round"/>
  <path d="M71 58c0-8-3-13-7-16" fill="none" stroke="#cfcac3" stroke-width="6" stroke-linecap="round"/>
  <path d="M44 44c3-2 7-3 10-2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".8"/>
  <!-- brows, smiling eyes, cheeks -->
  <path d="M39 53q4-3 8 0M55 53q4-3 8 0" fill="none" stroke="#8a8580" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M40 60q3 3 6 0M56 60q3 3 6 0" fill="none" stroke="#3b2414" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="38" cy="67" r="3.2" fill="#f28c6b" opacity=".55"/>
  <circle cx="64" cy="67" r="3.2" fill="#f28c6b" opacity=".55"/>
  <!-- nose, moustache, smile -->
  <path d="M51 62q3 4 0 6" fill="none" stroke="#9a5a2e" stroke-width="2" stroke-linecap="round"/>
  <path d="M38 72c4-4 9-4 13-1 4-3 9-3 13 1-3 3-8 4-13 1-5 3-10 2-13-1z" fill="#d6d1ca" stroke="#7d7770" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M45 76q6 5 12 0" fill="#9b2c2c" stroke="#7c2d12" stroke-width="1.8" stroke-linecap="round"/>
  <!-- hand + plate -->
  <circle cx="95" cy="68" r="6.5" fill="#f2c094" stroke="#7c2d12" stroke-width="2"/>
  <g transform="translate(95 58) scale(1.18) translate(-95 -58)">
    <!-- chicken pile -->
    <g fill="#d97706" stroke="#7c2d12" stroke-width="1.8">
      <circle cx="84" cy="54" r="4"/><circle cx="88" cy="50" r="4"/><circle cx="93" cy="48" r="4"/><circle cx="98" cy="49" r="4"/>
      <circle cx="103" cy="52" r="4"/><circle cx="106" cy="56" r="3.6"/>
    </g>
    <path d="M82 58c0-6 5-10 12-10s13 4 13 10z" fill="#d97706"/>
    <g fill="#b45309"><circle cx="90" cy="53" r="1.5"/><circle cx="97" cy="52" r="1.3"/><circle cx="102" cy="55" r="1.2"/></g>
    <path d="M87 50q3-3 6-3" fill="none" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/>
    <!-- bone -->
    <path d="M106 51l6-6" stroke="#7c2d12" stroke-width="5.6" stroke-linecap="round"/>
    <path d="M106 51l6-6" stroke="#fffaf0" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="113.5" cy="43" r="2.4" fill="#fffaf0" stroke="#7c2d12" stroke-width="1.6"/>
    <circle cx="115" cy="46" r="2.4" fill="#fffaf0" stroke="#7c2d12" stroke-width="1.6"/>
    <!-- plate -->
    <ellipse cx="95" cy="60" rx="22" ry="5.5" fill="#fffaf0" stroke="#7c2d12" stroke-width="2.2"/>
  </g>
  <!-- steam -->
  <path class="st s1" d="M84 36c-4-5 4-8 0-14"/>
  <path class="st s2" d="M95 34c-4-6 5-9 0-18"/>
  <path class="st s3" d="M106 36c-4-5 4-8 0-14"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#9a3412" stroke-width="4"/>
</svg>
